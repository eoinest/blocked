name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mac-companion:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test companion logic
        working-directory: companion
        run: swift test
      - name: Package universal Mac companion
        working-directory: companion
        run: |
          ./scripts/build-app.sh
          lipo -verify_arch arm64 x86_64 dist/Blocked.app/Contents/MacOS/BlockedKey

  button-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test button debounce and reconnect behavior
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror firmware/tests/button_gate_test.cpp -o /tmp/blocked-button-test
          /tmp/blocked-button-test

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: 1.3.1
      - name: Compile ESP32-S2 firmware with pinned board profile
        env:
          ARDUINO_NETWORK_CONNECTION_TIMEOUT: 600s
        run: arduino-cli compile --profile s2-mini firmware/blocked_key
